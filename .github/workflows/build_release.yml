name: upstream-build-release-disabled

# The upstream release workflow publishes subscription id 667 and is not valid
# for this fork. It is retained as a harmless placeholder to reduce sync noise.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Use custom-pr-check and sync-upstream in this fork.'
