name: custom-pr-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check custom overlay
        run: pnpm exec tsc --noEmit -p custom/tsconfig.json

      - name: Run overlay merge tests
        run: pnpm exec tsx custom/merge-apps.test.ts

      - name: Validate merged subscription
        run: pnpm exec tsx custom/check.ts

      - name: Check custom source formatting
        run: pnpm exec prettier --check "custom/**/*.{ts,json,md}"

      - name: Check custom source lint
        run: pnpm exec eslint --max-warnings=0 "custom/**/*.ts"

      - name: Rebuild tracked custom output
        run: pnpm exec tsx custom/build.ts

      - name: Require generated output to be current
        run: git diff --exit-code -- custom-dist
