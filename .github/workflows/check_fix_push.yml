name: upstream-check-fix-push-disabled

# The upstream workflow had broad write permission and pushed formatter changes.
# Fork validation is intentionally read-only in custom-pr-check.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Use custom-pr-check in this fork.'
