name: upstream-issue-content-check-disabled

# Issue automation inherited from upstream is not required for the personal
# subscription and remains disabled unless it is reviewed separately.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Inherited issue automation is disabled in this fork.'
