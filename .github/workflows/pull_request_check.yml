name: upstream-pull-request-check-disabled

# The inherited PR policy assumes one upstream src/apps file per PR. Custom
# overlay validation lives in custom-pr-check.yml instead.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Use custom-pr-check in this fork.'
